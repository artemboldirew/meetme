spring.application.name=shopik
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5430/shopik
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
logging.level.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

spring.redis.host=localhost
spring.redis.port=6379
